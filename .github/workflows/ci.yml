name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download self-hosted compiler
        run: |
          mkdir -p build
          # Download krc from pinned release — avoids CDN caching issues with /latest.
          # Hardened 2026-05-28: --fail to error on HTTP non-2xx (curl was silently
          # saving "Not Found" HTML and bash later parsed "Not" as a command), --retry
          # to ride out transient redirect-chain blips from release-assets blob storage,
          # and a post-download ELF magic + size sanity check before chmod. Canonical
          # repo URL (Heniokhos-Systems/KernRift) is used directly to skip the rename
          # redirect that fronts the older Pantelis23/ + Rift-Intelligence/ aliases.
          curl --fail --location --silent --show-error \
               --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 15 \
               -o build/krc-bootstrap \
               https://github.com/Heniokhos-Systems/KernRift/releases/download/v2.9.0/krc-linux-x86_64
          # Sanity: must be an ELF ≥ 1 MiB. If not, dump the first bytes so future
          # failures don't reduce to "Not: command not found" 40 lines later.
          SIZE=$(wc -c < build/krc-bootstrap)
          MAGIC=$(head -c 4 build/krc-bootstrap | xxd -p)
          if [ "$MAGIC" != "7f454c46" ] || [ "$SIZE" -lt 1048576 ]; then
            echo "FAIL: krc-bootstrap download is not a valid ELF"
            echo "  size=$SIZE bytes (expected ≥ 1 MiB)"
            echo "  magic=0x$MAGIC (expected 0x7f454c46)"
            echo "--- first 256 bytes ---"
            head -c 256 build/krc-bootstrap | cat -v
            exit 1
          fi
          chmod +x build/krc-bootstrap
          echo "OK: krc-bootstrap is a valid ELF ($SIZE bytes)"

      - name: Build (self-compile)
        run: |
          make build/krc.kr
          # Bootstrap: compile source with the pinned release krc (--legacy for
          # speed), then re-compile with itself (which uses IR by default).
          ./build/krc-bootstrap --legacy --arch=x86_64 build/krc.kr -o build/krc2
          chmod +x build/krc2
          ./build/krc2 --arch=x86_64 build/krc.kr -o build/krc2.stable
          mv build/krc2.stable build/krc2
          chmod +x build/krc2

      # The bare-metal boot gate (tests/target_none/boot_gate.sh) is now a
      # COUNTED test inside run_tests.sh, not a skip, so these emulators are a
      # hard dependency of the suite rather than an optional extra: without
      # them the suite goes red at the gate's dependency loop, naming the
      # missing tool. That is deliberate — the whole point of B1 is that a
      # check nobody can run must be visible, not silent.
      # THE GATE NEEDS NO ASSEMBLER OR LINKER AT ALL since B2 (tasks 3-4 made
      # the compiler emit its own entry stub; task 6 deleted the external
      # multiboot loader and its build script). This comment used to explain
      # why the runner's preinstalled `as`/`ld` were enough for build_loader.sh's
      # functional probe — there is no such probe now, on either job.
      # SUB-PROJECT D ADDED THE FIRMWARE IMAGES: L7 and L8 boot a PE32+ EFI
      # application under edk2, so `ovmf` (OVMF_CODE_4M.fd + VARS, x86_64) and
      # `qemu-efi-aarch64` (AAVMF_CODE.fd + VARS, arm64) are hard dependencies
      # of the gate on the same terms as the emulators — the legs report a
      # counted FAILURE naming every path they tried, never a skip. qemu-system
      # plus those two firmware packages is the whole of the gate's non-coreutils
      # toolchain.
      - name: Install boot-gate toolchain (qemu-system + UEFI firmware)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64

      # THE OPTIONAL CROSS-TARGET TOOLING, BEST-EFFORT. Without it the suite
      # still passes -- it just SKIPS the riscv32 and xtensa rows and then says
      # so ("ran 1508, README says 1618"). That message was being read as noise;
      # it is the suite reporting that ~86 rows on x86_64 and ~110 on arm64 were
      # never graded. These four packages are what a full local run has.
      #
      # EACH PACKAGE INSTALLS ON ITS OWN, AND A MISSING ONE IS NOT FATAL.
      # Package names differ across releases -- on Ubuntu 26.04 arm64
      # qemu-user-static has no candidate and the package is qemu-user
      # (measured) -- and the runners move to 26 in October 2026. A job must not
      # go red because a name changed; the rows skip themselves and say why.
      - name: Install optional cross-target tooling (riscv32, xtensa, qemu-user)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          # llvm (llvm-readobj, llvm-objdump, llvm-mc) and lld (lld-link):
          # the #143 unwind checker (tests/helpers/pe_unwind_check.py) needs
          # llvm-readobj for C1 and llvm-objdump for C2-C6; without them its
          # rows skip (CI run 42504860688 had neither).
          for p in qemu-system-misc binutils-riscv64-linux-gnu binutils-xtensa-lx106 \
                   qemu-user-static qemu-user llvm lld; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq "$p" >/dev/null 2>&1; then
                  echo "  installed: $p"
              else
                  echo "  unavailable (rows will SKIP): $p"
              fi
          done
          # BRIDGE THE NAME. THE BINARIES ARE THE SAME ONES. The suite asks for
          # qemu-<arch>-static in 65 places. On Ubuntu 26.04 the qemu-user
          # package ABSORBED qemu-user-static -- it declares
          # `Replaces: qemu-user-static`, its description is literally "QEMU
          # user mode emulation (static binaries)", and unpacking the .deb on a
          # native arm64 machine shows /usr/bin/qemu-aarch64, qemu-riscv32 and
          # qemu-x86_64 with no suffix at all. So these ARE the static
          # emulators; Ubuntu dropped the suffix in the rename. Linking the
          # name is therefore exact, not an approximation, and it beats
          # rewriting 65 call sites. A no-op on 24.04, where qemu-user-static
          # still installs under its own name.
          for a in aarch64 riscv32 x86_64; do
              if ! command -v "qemu-$a-static" >/dev/null 2>&1 \
                 && command -v "qemu-$a" >/dev/null 2>&1; then
                  sudo ln -sf "$(command -v "qemu-$a")" "/usr/local/bin/qemu-$a-static"
                  echo "  linked qemu-$a-static -> qemu-$a"
              fi
          done
          echo "--- what the suite can now reach ---"
          for t in qemu-system-xtensa qemu-system-riscv32 qemu-riscv32-static \
                   qemu-x86_64-static riscv64-linux-gnu-objdump riscv64-linux-gnu-ld \
                   xtensa-lx106-elf-objdump; do
              printf '  %-30s %s\n' "$t" "$(command -v $t >/dev/null 2>&1 && echo yes || echo NO)"
          done

      - name: Test suite
        run: |
          # The suite asserts the kr runner's reported version against the
          # changelog, and FAILS rather than skips when build/kr-bin is absent
          # (a check that quietly never runs is indistinguishable from one that
          # passes -- which is how v2.8.28 shipped binaries labelled 2.8.27).
          # This job invokes run_tests.sh directly rather than `make test`, so
          # the Makefile dependency does not apply here; build it explicitly.
          make build/kr-bin
          echo '#!/bin/bash' > /tmp/krc-test
          echo "exec $PWD/build/krc2 --arch=x86_64 \"\$@\"" >> /tmp/krc-test
          chmod +x /tmp/krc-test
          KRC=/tmp/krc-test KRC_RAW="$PWD/build/krc2" bash tests/run_tests.sh

      - name: Smoke suite (Linux x86_64 IR)
        run: KRC=./build/krc2 bash tests/smoke/run.sh

      - name: Smoke suite (Linux x86_64 legacy)
        run: KRC=./build/krc2 KRC_FLAGS="--legacy --arch=x86_64" bash tests/smoke/run.sh

      - name: Smoke suite (Linux ARM64 via qemu)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq qemu-user-static
          KRC=./build/krc2 KRC_FLAGS="--arch=arm64" SMOKE_RUNNER=qemu-aarch64-static bash tests/smoke/run.sh

      - name: Differential harness (legacy vs IR, Linux x86_64)
        run: KRC=./build/krc2 bash tests/diff/run.sh

      - name: Differential harness (IR x86_64 vs IR arm64 via qemu)
        run: DIFF_MODE=crossarch KRC=./build/krc2 bash tests/diff/run.sh

      - name: Fuzz harness (Tier 2 — random programs, Python oracle)
        run: KRC=./build/krc2 FUZZ_COUNT=50 FUZZ_SEED=3735928559 bash tests/fuzz/run.sh

      - name: Bootstrap verification (krc3 == krc4)
        run: make bootstrap

      - name: Cross-compile ARM64
        run: |
          ./build/krc2 --arch=arm64 build/krc.kr -o /tmp/krc-arm64
          file /tmp/krc-arm64 | grep -q "ARM aarch64"
          echo "ARM64 cross-compile: OK"

      - name: Fat binary verification
        run: |
          echo 'fn main() { exit(42) }' > /tmp/test.kr
          ./build/krc2 /tmp/test.kr -o /tmp/test.krbo
          python3 -c "
          d = open('/tmp/test.krbo','rb').read()
          assert d[:8] == b'KRBOFAT\x00', 'not a fat binary'
          import struct
          count = struct.unpack_from('<I', d, 12)[0]
          assert count == 8, f'expected 8 arches, got {count}'
          print(f'Fat binary OK: {count} architectures, {len(d)} bytes')
          "

      - name: Build krc.krbo (the compiler itself as a fat binary) + kr runners
        run: |
          # krc.krbo — 8-slice fat binary of the compiler
          ./build/krc2 build/krc.kr -o /tmp/krc.krbo
          ls -la /tmp/krc.krbo
          # Ship the concatenated source alongside so the Tier-1 #3
          # self-host fixed-point tests on macOS/Windows/Android have
          # something to feed back into krc4.
          cp build/krc.kr /tmp/krc-source.kr
          # kr runner for every platform (one source, seven slices)
          cat src/bcj.kr src/runner.kr > /tmp/kr.kr
          mkdir -p /tmp/kr-runners
          ./build/krc2 --arch=x86_64 /tmp/kr.kr -o /tmp/kr-runners/kr-linux-x86_64
          ./build/krc2 --arch=arm64  /tmp/kr.kr -o /tmp/kr-runners/kr-linux-arm64
          ./build/krc2 --arch=x86_64 --emit=macho /tmp/kr.kr -o /tmp/kr-runners/kr-macos-x86_64
          ./build/krc2 --arch=arm64  --emit=macho /tmp/kr.kr -o /tmp/kr-runners/kr-macos-arm64
          ./build/krc2 --arch=x86_64 --emit=pe    /tmp/kr.kr -o /tmp/kr-runners/kr-windows-x86_64.exe
          ./build/krc2 --arch=arm64  --emit=pe    /tmp/kr.kr -o /tmp/kr-runners/kr-windows-arm64.exe
          ls -la /tmp/kr-runners/

      - name: Fat-binary krc self-test (Linux x86_64 host)
        run: |
          # Prove the end-to-end stack works on THIS host:
          #   kr -> krc.krbo -> native krc slice -> compile test.kr -> run test
          /tmp/kr-runners/kr-linux-x86_64 /tmp/krc.krbo --version
          echo 'fn main() { println("krbo-via-kr OK"); exit(42) }' > /tmp/fb_test.kr
          /tmp/kr-runners/kr-linux-x86_64 /tmp/krc.krbo --arch=x86_64 /tmp/fb_test.kr -o /tmp/fb_test
          set +e
          OUT=$(/tmp/fb_test)
          CODE=$?
          set -e
          echo "output: $OUT"
          echo "exit:   $CODE"
          if [ "$OUT" != "krbo-via-kr OK" ] || [ "$CODE" -ne 42 ]; then
            echo "FAIL: fat-binary self-test on Linux x86_64"
            exit 1
          fi
          echo "PASS: fat-binary self-test on Linux x86_64"

      - name: Fat-binary self-host determinism (Linux x86_64)
        run: |
          # Pure fat-container determinism check: kr → compile_fat →
          # krc2.krbo → repeat → krc3.krbo, byte-compare. Extracts and
          # runs the Linux x86_64 slice from krc.krbo to drive the
          # compile; output is a new fat bundle with all 8 slices.
          # Byte-equality proves compile_fat itself (BCJ + LZ-Rift +
          # fixup ordering + slice concatenation) is deterministic on
          # this host.
          /tmp/kr-runners/kr-linux-x86_64 /tmp/krc.krbo /tmp/krc-source.kr -o /tmp/krc2.krbo
          /tmp/kr-runners/kr-linux-x86_64 /tmp/krc.krbo /tmp/krc-source.kr -o /tmp/krc3.krbo
          s2=$(wc -c < /tmp/krc2.krbo); s3=$(wc -c < /tmp/krc3.krbo)
          if cmp -s /tmp/krc2.krbo /tmp/krc3.krbo; then
            echo "PASS: Linux x86_64 fat self-host determinism ($s2 bytes)"
          else
            echo "FAIL: Linux x86_64 fat self-host — krc2.krbo ($s2) != krc3.krbo ($s3)"
            exit 1
          fi

      - name: Upload krc.krbo + kr runners
        uses: actions/upload-artifact@v6
        with:
          name: krc-fatbinary
          path: |
            /tmp/krc.krbo
            /tmp/kr-runners/
            /tmp/krc-source.kr

      - name: Cross-compile macOS and Windows
        run: |
          echo 'fn main() { exit(42) }' > /tmp/cross.kr
          ./build/krc2 --arch=x86_64 --emit=macho /tmp/cross.kr -o /tmp/cross-macos-x64
          file /tmp/cross-macos-x64 | grep -q "Mach-O 64-bit x86_64"
          echo "macOS x86_64 Mach-O: OK"

          ./build/krc2 --arch=arm64 --emit=macho /tmp/cross.kr -o /tmp/cross-macos-arm
          file /tmp/cross-macos-arm | grep -q "Mach-O 64-bit arm64"
          echo "macOS ARM64 Mach-O: OK"

          ./build/krc2 --arch=x86_64 --emit=pe /tmp/cross.kr -o /tmp/cross-win-x64.exe
          file /tmp/cross-win-x64.exe | grep -q "PE32+"
          echo "Windows x86_64 PE: OK"

          ./build/krc2 --arch=arm64 --emit=pe /tmp/cross.kr -o /tmp/cross-win-arm.exe
          file /tmp/cross-win-arm.exe | grep -q "PE32+"
          echo "Windows ARM64 PE: OK"

          # write() MUST RETURN THE BYTE COUNT ON WINDOWS, and only a Windows
          # runner can say so. The lowering calls WriteFile and used to hand
          # back its BOOL, so write(1,"abc",3) answered 1 and a 0-length write
          # answered 1 rather than 0 -- on every Windows backend, silently,
          # while Linux and macOS were correct. cross.kr is `exit(42)` and
          # never calls write, so nothing here could see it. exit code 7 means
          # both counts were right; 1 means they were not.
          printf 'fn main() {\n    uint64 a = write(1, "abc", 3)\n    uint64 b = write(1, "", 0)\n    if a == 3 { if b == 0 { exit(7) } }\n    exit(1)\n}\n' > /tmp/winret.kr
          ./build/krc2 --arch=x86_64 --emit=pe /tmp/winret.kr -o /tmp/winret-x64.exe
          ./build/krc2 --arch=arm64  --emit=pe /tmp/winret.kr -o /tmp/winret-arm.exe
          file /tmp/winret-x64.exe | grep -q "PE32+"
          file /tmp/winret-arm.exe | grep -q "PE32+"
          echo "Windows write()-return probes: OK"

          ./build/krc2 --emit=android /tmp/cross.kr -o /tmp/cross-android-arm
          file /tmp/cross-android-arm | grep -q "ARM aarch64"
          echo "Android ARM64 PIE: OK"

          ./build/krc2 --arch=x86_64 --emit=android /tmp/cross.kr -o /tmp/cross-android-x86
          file /tmp/cross-android-x86 | grep -q "x86-64"
          file /tmp/cross-android-x86 | grep -qi "shared object\|DYN"
          echo "Android x86_64 PIE: OK"

      - name: Android x86_64 execution test
        run: |
          # Run PIE ELF directly via glibc loader (bypasses PT_INTERP=/system/bin/linker64)
          echo 'fn main() { exit(42) }' > /tmp/androidx.kr
          ./build/krc2 --arch=x86_64 --emit=android /tmp/androidx.kr -o /tmp/androidx-exit42
          chmod +x /tmp/androidx-exit42
          set +e; /lib64/ld-linux-x86-64.so.2 /tmp/androidx-exit42; CODE=$?; set -e
          [ "$CODE" -eq 42 ] && echo "PASS: Android x86_64 exit(42)" || { echo "FAIL: expected 42, got $CODE"; exit 1; }

          echo 'static uint64 c = 0
          fn inc() { c = c + 1 }
          fn main() { println("Android x86_64!"); inc(); inc(); inc(); exit(c) }' > /tmp/androidx.kr
          ./build/krc2 --arch=x86_64 --emit=android /tmp/androidx.kr -o /tmp/androidx-static
          chmod +x /tmp/androidx-static
          set +e; /lib64/ld-linux-x86-64.so.2 /tmp/androidx-static; CODE=$?; set -e
          [ "$CODE" -eq 3 ] && echo "PASS: Android x86_64 statics (exit=3)" || { echo "FAIL: expected 3, got $CODE"; exit 1; }

          # Full Android x86_64 self-compile + fixed point. Uses the
          # glibc loader directly since we don't have bionic on the CI
          # box. krc-androidx compiles the full source → krc-androidx-2;
          # byte-equality is the deterministic-codegen test.
          ./build/krc2 --arch=x86_64 --emit=android build/krc.kr -o /tmp/krc-androidx
          chmod +x /tmp/krc-androidx
          set +e
          /lib64/ld-linux-x86-64.so.2 /tmp/krc-androidx --arch=x86_64 --emit=android build/krc.kr -o /tmp/krc-androidx-2
          COMP=$?
          set -e
          [ "$COMP" -eq 0 ] && echo "PASS: Android x86_64 full self-compile" || { echo "FAIL: Android x86_64 self-compile (exit=$COMP)"; exit 1; }
          chmod +x /tmp/krc-androidx-2
          if cmp -s /tmp/krc-androidx /tmp/krc-androidx-2; then
            echo "PASS: Android x86_64 fixed point ($(wc -c < /tmp/krc-androidx) bytes)"
          else
            echo "FAIL: Android x86_64 fixed point — krc-androidx ($(wc -c < /tmp/krc-androidx)) != krc-androidx-2 ($(wc -c < /tmp/krc-androidx-2))"
            exit 1
          fi

      - name: Android ARM64 execution test (QEMU)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq >/dev/null 2>&1
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y qemu-user-static gcc-aarch64-linux-gnu >/dev/null 2>&1
          # Symlink the Linux ARM64 linker as Android's linker64
          sudo mkdir -p /system/bin
          sudo ln -sf /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 /system/bin/linker64

          # Test 1: exit(42)
          echo 'fn main() { exit(42) }' > /tmp/android.kr
          ./build/krc2 --emit=android /tmp/android.kr -o /tmp/android-exit42
          chmod +x /tmp/android-exit42
          set +e; qemu-aarch64-static /tmp/android-exit42; CODE=$?; set -e
          [ "$CODE" -eq 42 ] && echo "PASS: Android exit(42)" || { echo "FAIL: expected 42, got $CODE"; exit 1; }

          # Test 2: println + statics
          echo 'static uint64 c = 0
          fn inc() { c = c + 1 }
          fn main() { println("Android QEMU!"); inc(); inc(); inc(); exit(c) }' > /tmp/android.kr
          ./build/krc2 --emit=android /tmp/android.kr -o /tmp/android-static
          chmod +x /tmp/android-static
          set +e; qemu-aarch64-static /tmp/android-static; CODE=$?; set -e
          [ "$CODE" -eq 3 ] && echo "PASS: Android statics (exit=3)" || { echo "FAIL: expected 3, got $CODE"; exit 1; }

          # Test 3: self-compile on QEMU
          ./build/krc2 --emit=android build/krc.kr -o /tmp/krc-android
          chmod +x /tmp/krc-android
          echo 'fn main() { exit(99) }' > /tmp/android-selftest.kr
          set +e; qemu-aarch64-static /tmp/krc-android --emit=android /tmp/android-selftest.kr -o /tmp/android-selfout; COMP=$?; set -e
          [ "$COMP" -eq 0 ] && echo "PASS: Android self-compile" || { echo "FAIL: compile exit=$COMP"; exit 1; }
          chmod +x /tmp/android-selfout
          set +e; qemu-aarch64-static /tmp/android-selfout; CODE=$?; set -e
          [ "$CODE" -eq 99 ] && echo "PASS: Android self-compiled binary runs (exit=99)" || { echo "FAIL: expected 99, got $CODE"; exit 1; }

          # Test 4: Android ARM64 bootstrap fixed point under qemu. Have
          # krc-android compile the full krc source → krc-android-2, then
          # diff bytes. This catches Android-specific codegen non-
          # determinism that a trivial exit(99) test can't see. Slow
          # (~25s on qemu emulation) but covers the scenario the Redmi
          # Note 8 Pro phone runs in production.
          set +e
          qemu-aarch64-static /tmp/krc-android --emit=android build/krc.kr -o /tmp/krc-android-2
          COMP=$?
          set -e
          [ "$COMP" -eq 0 ] && echo "PASS: Android full self-compile" || { echo "FAIL: Android self-compile (exit=$COMP)"; exit 1; }
          chmod +x /tmp/krc-android-2
          if cmp -s /tmp/krc-android /tmp/krc-android-2; then
            echo "PASS: Android ARM64 fixed point ($(wc -c < /tmp/krc-android) bytes)"
          else
            echo "FAIL: Android ARM64 fixed point — krc-android ($(wc -c < /tmp/krc-android)) != krc-android-2 ($(wc -c < /tmp/krc-android-2))"
            exit 1
          fi

      - name: Fat binary runner (kr) test
        run: |
          # Build kr runner
          cat src/bcj.kr src/runner.kr > /tmp/kr_src.kr
          ./build/krc2 --arch=x86_64 /tmp/kr_src.kr -o /tmp/kr
          chmod +x /tmp/kr

          # Compile a test program to fat binary
          echo 'fn main() { println("kr runner works!"); exit(42) }' > /tmp/kr_test.kr
          ./build/krc2 /tmp/kr_test.kr -o /tmp/kr_test.krbo

          # Run via kr runner — should extract x86_64 slice and execute
          set +e
          OUTPUT=$(/tmp/kr /tmp/kr_test.krbo 2>&1)
          CODE=$?
          set -e
          echo "kr output: $OUTPUT"
          echo "kr exit: $CODE"
          if [ "$CODE" -eq 42 ] && echo "$OUTPUT" | grep -q "kr runner works"; then
            echo "PASS: kr runner (fat binary → x86_64 → exit 42)"
          else
            echo "FAIL: kr runner (exit=$CODE, output=$OUTPUT)"
            exit 1
          fi

      # #143 A18 (plan A18, spec 8.5): the arm64 Windows dynamic proof. The
      # unwind tables are checked statically by the suite (C0-C6 + C3b + C4b)
      # and walked under Wine only on x86_64; windows-11-arm is the only
      # native arm64 Windows there is. Built here, run by test-windows-arm64
      # ("pe-unwind arm64 fault fixtures"). cases.tsv: <image> <kind>
      # <stdout, lines joined by |> <chain>; kind fault = must end with
      # STATUS_ACCESS_VIOLATION (-1073741819) 3 of 3 runs printing <stdout>,
      # and with cdb its stack must be <chain> then BaseThreadInitThunk,
      # RtlUserThreadStart; <image>_nouw.exe is the same build with
      # --test-no-unwind, whose cdb chain must NOT hold; kind exec = run next
      # to child.exe, must exit 7 (#174). The listings name the frames.
      - name: Build pe-unwind arm64 Windows fixtures (#143 A18)
        run: |
          D=/tmp/peu-arm64; rm -rf "$D"; mkdir -p "$D"
          : > "$D/cases.tsv"
          peu() { # <image> <kind> <fixture> <flags> <stdout> <chain>
            ./build/krc2 --arch=arm64 --target=windows --emit=pe $4 --test-listing="$D/$1.lst" "tests/fixtures/$3.kr" -o "$D/$1.exe"
            if [ "$2" = fault ]; then
              ./build/krc2 --arch=arm64 --target=windows --emit=pe $4 --test-no-unwind --test-listing="$D/$1_nouw.lst" "tests/fixtures/$3.kr" -o "$D/$1_nouw.exe"
            fi
            printf '%s\t%s\t%s\t%s\n' "$1" "$2" "$5" "$6" >> "$D/cases.tsv"
          }
          for L in ir legacy; do
            F=""; [ "$L" = legacy ] && F=--legacy
            peu nested_$L       fault pe_unwind_nested_fault      "$F" 'armed|f3' f3,f2,f1,main
            peu stack_args_$L   fault pe_unwind_stack_args_fault  "$F" 'armed|f3' f3,f2,main
            peu argv_main_$L    fault pe_unwind_argv_main_fault   "$F" 'armed|f2' f2,f1,main
            peu temp_push_$L    fault pe_unwind_temp_push_fault   "$F" '7|3'      f2,f1,main
            peu mixed_$L        fault pe_unwind_mixed_fault       "$F" 'armed|b'  c,b,a,main
            peu mixed_arm64_$L  fault pe_unwind_mixed_fault_arm64 "$F" 'armed'    c,b,a,main
            for V in exec_process_f exec_process_m exec_process_argv_f exec_process_argv_m; do
              peu ${V}_$L exec win_fold_diff/$V "$F" '' ''
            done
          done
          # the guard pair: IR only (std/alloc.kr's legacy arm64 Windows
          # build is refused, syscall_raw); the fault is inside std, so only
          # main is pinned
          peu guard_ir      fault alloc_guard_fault      "" 'armed' ...,main
          peu guard_read_ir fault alloc_guard_fault_read "" 'armed' ...,main
          # pe_unwind_naked_fault is x86_64 asm; an arm64 naked function
          # cannot call (LANGUAGE.md), so there is no arm64 naked fixture
          ./build/krc2 --arch=arm64 --target=windows --emit=pe tests/fixtures/win_fold_diff/child.kr -o "$D/child.exe"
          echo "$(wc -l < "$D/cases.tsv") cases, $(ls "$D"/*.exe | wc -l) images"
          cat "$D/cases.tsv"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: krc-linux-x86_64
          path: build/krc2

      - name: Upload Linux ARM64 krc (for native job)
        uses: actions/upload-artifact@v6
        with:
          name: krc-linux-arm64
          path: /tmp/krc-arm64

      - name: Upload cross-compiled binaries
        uses: actions/upload-artifact@v6
        with:
          name: cross-compiled
          path: |
            /tmp/cross-macos-x64
            /tmp/cross-macos-arm
            /tmp/cross-win-x64.exe
            /tmp/cross-win-arm.exe
            /tmp/winret-x64.exe
            /tmp/winret-arm.exe
            /tmp/peu-arm64/

  build-test-linux-arm64:
    name: Build and Test (Linux ARM64, native)
    needs: build-test
    runs-on: ubuntu-24.04-arm
    # the step below (35) + ~1.5 min of setup before it + the upload after it
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download freshly built krc-linux-arm64
        uses: actions/download-artifact@v7
        with:
          name: krc-linux-arm64
          path: build/

      - name: Download krc.krbo + kr runners
        uses: actions/download-artifact@v7
        with:
          name: krc-fatbinary
          path: /tmp/fatbin

      # An x86-capable disassembler. Ubuntu builds binutils with one target set
      # per host arch, so this runner's /usr/bin/objdump knows aarch64 and
      # nothing else: `objdump -m i386:x86-64` errors and prints no
      # instructions. The --target=none gate disassembles a cross-compiled
      # x86_64 bare-metal image to prove println really lowers to the 16550
      # UART `out %al,(%dx)`, and it asserts both directions, so a disassembler
      # that prints nothing reads as "the UART store is missing" -- a real FAIL
      # for a tooling reason. binutils-x86-64-linux-gnu supplies
      # x86_64-linux-gnu-objdump, which the gate probes for and selects. NOT
      # continue-on-error: if this stops installing, the gate must go red
      # rather than quietly lose its artifact-proof leg.
      - name: Install x86_64 cross binutils (for the --target=none byte proof)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq binutils-x86-64-linux-gnu
          x86_64-linux-gnu-objdump --version | head -1

      # Same hard dependency as the x86_64 job. The step ABOVE is the one that
      # matters for binutils on this runner: bare `binutils` here IS aarch64
      # binutils, and prove_no_syscalls.sh's gate-2 leg needs an objdump that
      # can decode x86-64 — hence binutils-x86-64-linux-gnu. (Until B2 Task 6
      # that package also supplied the x86-capable as/ld the external loader's
      # build script probed for; the loader is deleted and the boot gate now
      # requires no assembler or linker on either job.)
      # DECLARED, NOT VERIFIED FROM THE DEV MACHINE: whether qemu-system-x86 is
      # installable on ubuntu-24.04-arm, and what the emulated x86 boot costs in
      # wall clock there. If the package is unavailable the job fails at this
      # step — visible and attributable — and the fallback (an explicit counted
      # host gate on the x86 leg) goes through review, never through a silent
      # skip.
      - name: Install boot-gate toolchain (qemu-system + UEFI firmware)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64

      # THE OPTIONAL CROSS-TARGET TOOLING, BEST-EFFORT. Without it the suite
      # still passes -- it just SKIPS the riscv32 and xtensa rows and then says
      # so ("ran 1508, README says 1618"). That message was being read as noise;
      # it is the suite reporting that ~86 rows on x86_64 and ~110 on arm64 were
      # never graded. These four packages are what a full local run has.
      #
      # EACH PACKAGE INSTALLS ON ITS OWN, AND A MISSING ONE IS NOT FATAL.
      # Package names differ across releases -- on Ubuntu 26.04 arm64
      # qemu-user-static has no candidate and the package is qemu-user
      # (measured) -- and the runners move to 26 in October 2026. A job must not
      # go red because a name changed; the rows skip themselves and say why.
      - name: Install optional cross-target tooling (riscv32, xtensa, qemu-user)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          # llvm (llvm-readobj, llvm-objdump, llvm-mc) and lld (lld-link):
          # the #143 unwind checker (tests/helpers/pe_unwind_check.py) needs
          # llvm-readobj for C1 and llvm-objdump for C2-C6; without them its
          # rows skip (CI run 42504860688 had neither).
          for p in qemu-system-misc binutils-riscv64-linux-gnu binutils-xtensa-lx106 \
                   qemu-user-static qemu-user llvm lld; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq "$p" >/dev/null 2>&1; then
                  echo "  installed: $p"
              else
                  echo "  unavailable (rows will SKIP): $p"
              fi
          done
          # BRIDGE THE NAME. THE BINARIES ARE THE SAME ONES. The suite asks for
          # qemu-<arch>-static in 65 places. On Ubuntu 26.04 the qemu-user
          # package ABSORBED qemu-user-static -- it declares
          # `Replaces: qemu-user-static`, its description is literally "QEMU
          # user mode emulation (static binaries)", and unpacking the .deb on a
          # native arm64 machine shows /usr/bin/qemu-aarch64, qemu-riscv32 and
          # qemu-x86_64 with no suffix at all. So these ARE the static
          # emulators; Ubuntu dropped the suffix in the rename. Linking the
          # name is therefore exact, not an approximation, and it beats
          # rewriting 65 call sites. A no-op on 24.04, where qemu-user-static
          # still installs under its own name.
          for a in aarch64 riscv32 x86_64; do
              if ! command -v "qemu-$a-static" >/dev/null 2>&1 \
                 && command -v "qemu-$a" >/dev/null 2>&1; then
                  sudo ln -sf "$(command -v "qemu-$a")" "/usr/local/bin/qemu-$a-static"
                  echo "  linked qemu-$a-static -> qemu-$a"
              fi
          done
          echo "--- what the suite can now reach ---"
          for t in qemu-system-xtensa qemu-system-riscv32 qemu-riscv32-static \
                   qemu-x86_64-static riscv64-linux-gnu-objdump riscv64-linux-gnu-ld \
                   xtensa-lx106-elf-objdump; do
              printf '  %-30s %s\n' "$t" "$(command -v $t >/dev/null 2>&1 && echo yes || echo NO)"
          done

      - name: Self-compile + tests (everything to debug-kit)
        continue-on-error: true
        # Measured from the runs' per-line log timestamps: main 9.8 min (run
        # 40410847542); with #143 about 13.7 min (run 42521616681 was killed at
        # the old 12 by this step's limit while running
        # sys_stage1b_windows_calls_route_by_name, 161 s on main, with 27 rows
        # left). The new rows add ~180 s on arm64 (pe_unwind_selfhost_* ~46 s
        # each); rows shared with main got ~10 % slower (they compile Windows
        # images). 35 = about 2.5x the measured time.
        timeout-minutes: 35
        run: |
          set +e
          mkdir -p debug-kit
          LOG=debug-kit/linux-arm64-debug.log
          exec > >(tee -a "$LOG") 2>&1

          echo "=== host info ==="
          uname -a
          cat /proc/cpuinfo | head -20 || true
          echo

          echo "=== bootstrap krc-linux-arm64 (just cross-compiled by build-test) ==="
          mv build/krc-arm64 build/krc-bootstrap
          chmod +x build/krc-bootstrap
          ls -la build/krc-bootstrap
          file build/krc-bootstrap
          ./build/krc-bootstrap --version || echo "bootstrap version check: $?"
          echo

          echo "=== concatenate source ==="
          make build/krc.kr
          wc -l build/krc.kr
          echo

          # Note: unlike the other jobs, this one does NOT seed from the pinned
          # release. Its seed is build/krc-arm64, freshly cross-compiled by the
          # x86_64 job above, and it is an arm64 binary because this runner is
          # arm64. Anything added here must respect both facts.
          echo "=== self-compile pass 1 ==="
          timeout 120 ./build/krc-bootstrap --arch=arm64 build/krc.kr -o build/krc2
          SC1=$?
          chmod +x build/krc2 2>/dev/null
          ls -la build/krc2 2>/dev/null
          echo "pass 1 exit=$SC1"
          echo

          echo "=== self-compile pass 2 (krc2 compiles itself → krc3) ==="
          timeout 120 ./build/krc2 --arch=arm64 build/krc.kr -o build/krc3
          SC2=$?
          chmod +x build/krc3 2>/dev/null
          echo "pass 2 exit=$SC2"
          echo

          echo "=== self-compile pass 3 (krc3 compiles itself → krc4) ==="
          timeout 120 ./build/krc3 --arch=arm64 build/krc.kr -o build/krc4
          SC3=$?
          chmod +x build/krc4 2>/dev/null
          echo "pass 3 exit=$SC3"
          echo

          echo "=== bootstrap fixed-point check (krc3 ?= krc4) ==="
          if cmp build/krc3 build/krc4 2>/dev/null; then
            echo "FIXED POINT OK"
            BSEXIT=0
          else
            echo "FIXED POINT DIVERGED"
            BSEXIT=1
          fi
          echo

          echo "=== test suite ==="
          # Needed by the runner-version assertion; see the x86_64 job above.
          make build/kr-bin || true
          echo '#!/bin/bash' > /tmp/krc-test
          echo "exec $PWD/build/krc3 --arch=arm64 \"\$@\"" >> /tmp/krc-test
          chmod +x /tmp/krc-test
          KRC=/tmp/krc-test KRC_RAW="$PWD/build/krc3" bash tests/run_tests.sh
          TESTEXIT=$?
          echo
          echo "=== SUMMARY ==="
          echo "self-compile pass 1: $SC1"
          echo "self-compile pass 2: $SC2"
          echo "self-compile pass 3: $SC3"
          echo "bootstrap fixed point: $BSEXIT"
          echo "test suite: $TESTEXIT"
          TOTAL_FAIL=0
          [ "$SC1" = "0" ] || TOTAL_FAIL=1
          [ "$SC2" = "0" ] || TOTAL_FAIL=1
          [ "$SC3" = "0" ] || TOTAL_FAIL=1
          [ "$BSEXIT" = "0" ] || TOTAL_FAIL=1
          [ "$TESTEXIT" = "0" ] || TOTAL_FAIL=1
          echo $TOTAL_FAIL > debug-kit/fail-count.txt

          echo
          echo "=== fat-binary krc via kr runner (native arm64) ==="
          chmod +x /tmp/fatbin/kr-runners/kr-linux-arm64
          /tmp/fatbin/kr-runners/kr-linux-arm64 /tmp/fatbin/krc.krbo --version
          FB_VER=$?
          echo 'fn main() { println("fb-arm64-ok"); exit(42) }' > /tmp/fb_test.kr
          /tmp/fatbin/kr-runners/kr-linux-arm64 /tmp/fatbin/krc.krbo --arch=arm64 /tmp/fb_test.kr -o /tmp/fb_test
          FB_CC=$?
          /tmp/fb_test 2>&1
          FB_RUN=$?
          echo "fb version exit: $FB_VER"
          echo "fb compile exit: $FB_CC"
          echo "fb run exit: $FB_RUN"
          if [ "$FB_VER" = "0" ] && [ "$FB_CC" = "0" ] && [ "$FB_RUN" = "42" ]; then
            echo "PASS: fat-binary krc via kr runner on Linux ARM64"
          else
            echo "FAIL: fat-binary krc via kr runner on Linux ARM64"
          fi
          exit 0

      - name: Upload linux-arm64 debug log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-debug-log
          path: debug-kit/
          retention-days: 14

      - name: Report final status
        run: |
          FAIL=$(cat debug-kit/fail-count.txt 2>/dev/null || echo 1)
          if [ "$FAIL" != "0" ]; then
            echo "Linux ARM64 native tests failed — see the 'linux-arm64-debug-log' artifact"
            exit 1
          fi
          echo "Linux ARM64 native: all passes green"

  test-macos:
    name: Test (macOS)
    needs: build-test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download cross-compiled binaries
        uses: actions/download-artifact@v7
        with:
          name: cross-compiled
          path: /tmp/bins

      - name: Download krc.krbo + kr runners
        uses: actions/download-artifact@v7
        with:
          name: krc-fatbinary
          path: /tmp/fatbin

      - name: Fat-binary krc via kr runner (macOS ARM64 native + x86_64 Rosetta)
        continue-on-error: true
        run: |
          set +e
          KRBO=/tmp/fatbin/krc.krbo
          chmod +x /tmp/fatbin/kr-runners/kr-macos-arm64 /tmp/fatbin/kr-runners/kr-macos-x86_64

          # macOS arm64 host native path
          echo "=== macOS arm64 native: kr -> krc.krbo -> arm64 krc slice ==="
          /tmp/fatbin/kr-runners/kr-macos-arm64 "$KRBO" --version
          V_ARM_EXIT=$?
          echo "exit: $V_ARM_EXIT"

          echo 'fn main() { exit(42) }' > /tmp/fbtest.kr
          /tmp/fatbin/kr-runners/kr-macos-arm64 "$KRBO" --target=macos --arch=arm64 /tmp/fatbin/../fbtest.kr -o /tmp/fbtest_out 2>&1 || true
          # Some runners fall back via tmp dir relative to cwd
          ls -la /tmp/fbtest_out 2>/dev/null || true

          # macOS x86_64 via Rosetta
          echo "=== macOS x86_64 (Rosetta): kr -> krc.krbo -> x86_64 krc slice ==="
          arch -x86_64 /tmp/fatbin/kr-runners/kr-macos-x86_64 "$KRBO" --version
          V_X64_EXIT=$?
          echo "exit: $V_X64_EXIT"

          if [ "$V_ARM_EXIT" = "0" ] || [ "$V_X64_EXIT" = "0" ]; then
            echo "PASS: at least one macOS slice accepts kr -> krc.krbo --version"
          else
            echo "FAIL: neither macOS slice printed version"
          fi

      - name: Build reference and test both
        continue-on-error: true
        run: |
          # Build reference binary WITH libSystem
          cat > /tmp/ref.s << 'SEOF'
          .global _main
          .align 4
          _main:
            mov x0, #42
            mov x16, #1
            svc #0x80
          SEOF
          as -o /tmp/ref.o /tmp/ref.s
          ld -o /tmp/ref_arm64 /tmp/ref.o -lSystem -syslibroot $(xcrun --show-sdk-path) -e _main -arch arm64
          codesign -s - /tmp/ref_arm64
          set +e; /tmp/ref_arm64; REF_EXIT=$?; set -e
          echo "Reference (with libSystem): exit=$REF_EXIT"

          # Test KernRift binary (disable set -e to capture exit codes)
          chmod +x /tmp/bins/cross-macos-arm
          # LC_UNIXTHREAD binaries don't need codesign (kernel handles directly)
          set +e
          /tmp/bins/cross-macos-arm
          KR_EXIT=$?
          set -e
          echo "KernRift ARM64: exit=$KR_EXIT"

          # Test x86_64 via Rosetta
          chmod +x /tmp/bins/cross-macos-x64
          set +e
          arch -x86_64 /tmp/bins/cross-macos-x64
          X64_EXIT=$?
          set -e
          echo "KernRift x86_64 Rosetta: exit=$X64_EXIT"

          # Verdict
          FAIL=0
          [ "$KR_EXIT" -eq 42 ] && echo "PASS: macOS ARM64" || { echo "FAIL: macOS ARM64 (got $KR_EXIT)"; FAIL=1; }
          [ "$X64_EXIT" -eq 42 ] && echo "PASS: macOS x86_64" || { echo "FAIL: macOS x86_64 (got $X64_EXIT)"; FAIL=1; }
          exit $FAIL

      - name: Self-compile on macOS (ARM64 native)
        run: |
          chmod +x /tmp/fatbin/kr-runners/kr-macos-arm64
          # Verify kr runner works
          /tmp/fatbin/kr-runners/kr-macos-arm64 --version
          # krc via fat binary: compile a test program
          echo 'fn main() { exit(42) }' > /tmp/sc_test.kr
          /tmp/fatbin/kr-runners/kr-macos-arm64 /tmp/fatbin/krc.krbo --arch=arm64 --emit=macho /tmp/sc_test.kr -o /tmp/sc_test_mac
          chmod +x /tmp/sc_test_mac
          # Run the self-compiled binary
          set +e; /tmp/sc_test_mac; CODE=$?; set -e
          echo "exit: $CODE"
          [ "$CODE" -eq 42 ] && echo "PASS: macOS ARM64 self-compile" || { echo "FAIL: macOS ARM64 self-compile (got $CODE)"; exit 1; }

      - name: Full krc self-host fixed point on macOS ARM64 (native)
        run: |
          # Extract the macOS arm64 slice and compile the full compiler
          # source with it — the real self-host test. krc3 is the fat-
          # extracted binary; krc4 is krc3 compiling krc-source.kr; krc5
          # is krc4 doing the same. krc4 must equal krc5 byte-for-byte
          # (the fixed point). Catches arm64-native codegen divergence
          # that a 10-line exit(42) test can't see.
          chmod +x /tmp/fatbin/kr-runners/kr-macos-arm64
          cp /tmp/fatbin/krc-source.kr /tmp/krc-source.kr
          /tmp/fatbin/kr-runners/kr-macos-arm64 /tmp/fatbin/krc.krbo --arch=arm64 --emit=macho /tmp/krc-source.kr -o /tmp/krc4
          chmod +x /tmp/krc4
          /tmp/krc4 --arch=arm64 --emit=macho /tmp/krc-source.kr -o /tmp/krc5
          chmod +x /tmp/krc5
          if cmp -s /tmp/krc4 /tmp/krc5; then
            echo "PASS: macOS ARM64 fixed point ($(wc -c < /tmp/krc4) bytes)"
          else
            echo "FAIL: macOS ARM64 fixed point — krc4 ($(wc -c < /tmp/krc4)) != krc5 ($(wc -c < /tmp/krc5))"
            exit 1
          fi
          # Sanity: krc5 should compile a trivial program the same way as krc4
          echo 'fn main() { exit(77) }' > /tmp/fp_test.kr
          /tmp/krc5 --arch=arm64 --emit=macho /tmp/fp_test.kr -o /tmp/fp_out
          chmod +x /tmp/fp_out
          set +e; /tmp/fp_out; CODE=$?; set -e
          [ "$CODE" -eq 77 ] && echo "PASS: macOS ARM64 krc5 runs" || { echo "FAIL: krc5 run (got $CODE)"; exit 1; }

      - name: Fat-binary self-host determinism on macOS ARM64
        run: |
          # kr runner extracts the macOS arm64 slice from krc.krbo,
          # which then compiles krc-source.kr into a NEW fat bundle
          # (krc2.krbo — 8 slices compressed together). A second pass
          # with krc2.krbo must produce krc3.krbo byte-equal to
          # krc2.krbo. This catches compile_fat non-determinism
          # specific to the macOS arm64 compiler slice: BCJ filter
          # state leakage, LZ-Rift hash-table drift, ordering of
          # static-fixup resolution, etc. Slice-level fixed point
          # (above) already covers the native-emitter deterministic
          # output; this covers the fat container around it.
          chmod +x /tmp/fatbin/kr-runners/kr-macos-arm64
          /tmp/fatbin/kr-runners/kr-macos-arm64 /tmp/fatbin/krc.krbo /tmp/fatbin/krc-source.kr -o /tmp/krc2.krbo
          /tmp/fatbin/kr-runners/kr-macos-arm64 /tmp/krc2.krbo /tmp/fatbin/krc-source.kr -o /tmp/krc3.krbo
          s2=$(wc -c < /tmp/krc2.krbo)
          s3=$(wc -c < /tmp/krc3.krbo)
          if cmp -s /tmp/krc2.krbo /tmp/krc3.krbo; then
            echo "PASS: macOS ARM64 fat self-host determinism ($s2 bytes)"
          else
            echo "FAIL: macOS ARM64 fat self-host — krc2.krbo ($s2) != krc3.krbo ($s3)"
            # Show which byte first diverges for diagnosis
            cmp /tmp/krc2.krbo /tmp/krc3.krbo || true
            exit 1
          fi

  test-windows-x64:
    name: Test (Windows x86_64)
    needs: build-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download cross-compiled binaries
        uses: actions/download-artifact@v7
        with:
          name: cross-compiled
          path: C:\tmp\bins

      - name: Download krc.krbo + kr runners
        uses: actions/download-artifact@v7
        with:
          name: krc-fatbinary
          path: C:\tmp\fatbin

      - name: Run Windows x86_64 binary
        shell: pwsh
        run: |
          & C:\tmp\bins\cross-win-x64.exe
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          if ($code -ne 42) { Write-Host "FAIL: expected 42, got $code"; exit 1 }
          Write-Host "PASS: Windows x86_64 exit(42)"
          exit 0

      - name: Windows x86_64 write() returns the byte count
        shell: pwsh
        run: |
          & C:\tmp\bins\winret-x64.exe
          $code = $LASTEXITCODE
          if ($code -ne 7) {
            Write-Host "FAIL: write() did not return the byte count (exit $code, want 7). WriteFile's BOOL is being returned instead of lpNumberOfBytesWritten."
            exit 1
          }
          Write-Host "PASS: Windows x86_64 write() returns 3 and 0, not 1"
          exit 0

      - name: Fat-binary krc via kr runner (Windows x86_64)
        shell: pwsh
        continue-on-error: true
        run: |
          $kr  = "C:\tmp\fatbin\kr-runners\kr-windows-x86_64.exe"
          $krbo = "C:\tmp\fatbin\krc.krbo"
          Write-Host "=== kr --version ==="
          & $kr $krbo --version
          $exit1 = $LASTEXITCODE
          Write-Host "exit: $exit1"
          if ($exit1 -eq 0) {
            Write-Host "PASS: Windows x86_64 fat-binary krc --version"
          } else {
            Write-Host "FAIL: Windows x86_64 fat-binary krc --version (exit=$exit1)"
          }

  test-windows-arm64:
    name: Test (Windows ARM64)
    needs: build-test
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download cross-compiled binaries
        uses: actions/download-artifact@v7
        with:
          name: cross-compiled
          path: C:\tmp\bins

      - name: Download krc.krbo + kr runners
        uses: actions/download-artifact@v7
        with:
          name: krc-fatbinary
          path: C:\tmp\fatbin

      - name: Fat-binary krc via kr runner (Windows ARM64)
        shell: pwsh
        continue-on-error: true
        run: |
          $kr  = "C:\tmp\fatbin\kr-runners\kr-windows-arm64.exe"
          $krbo = "C:\tmp\fatbin\krc.krbo"
          Write-Host "=== kr --version ==="
          & $kr $krbo --version
          $exit1 = $LASTEXITCODE
          Write-Host "exit: $exit1"
          if ($exit1 -eq 0) {
            Write-Host "PASS: Windows ARM64 fat-binary krc --version"
          } else {
            Write-Host "FAIL: Windows ARM64 fat-binary krc --version (exit=$exit1)"
          }

      - name: Run Windows ARM64 binary
        shell: pwsh
        run: |
          & C:\tmp\bins\cross-win-arm.exe
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          if ($code -ne 42) { Write-Host "FAIL: expected 42, got $code"; exit 1 }
          Write-Host "PASS: Windows ARM64 exit(42)"
          exit 0

      - name: Windows ARM64 write() returns the byte count
        shell: pwsh
        run: |
          & C:\tmp\bins\winret-arm.exe
          $code = $LASTEXITCODE
          if ($code -ne 7) {
            Write-Host "FAIL: write() did not return the byte count (exit $code, want 7). WriteFile's BOOL is being returned instead of lpNumberOfBytesWritten."
            exit 1
          }
          Write-Host "PASS: Windows ARM64 write() returns 3 and 0, not 1"
          exit 0

      # #143 A18: the arm64 dynamic proof (see "Build pe-unwind arm64 Windows
      # fixtures"). Before anything runs: exactly 22 cases (14 fault, 8 exec)
      # and every image and listing present. Each fault image 3 runs (exit
      # -1073741819, its stdout) and, under cdb, its chain; each
      # --test-no-unwind twin's chain must be BROKEN (reader exit 1, a chain
      # mismatch after the access violation -- exit 2, any other reader
      # failure, fails the step). No cdb fails the step, unless the explicit
      # opt-out PEU_A18_ALLOW_NO_CDB=1 is set (then the log says the chains
      # are NOT proven and #150 stays open). No continue-on-error.
      - name: pe-unwind arm64 fault fixtures (#143 A18)
        shell: pwsh
        run: |
          $D = 'C:\tmp\bins\peu-arm64'
          Set-Location $D
          $bad = 0
          $cdb = @('C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe') +
                 @(Get-AppxPackage *WinDbg* -ErrorAction SilentlyContinue | ForEach-Object { Join-Path $_.InstallLocation 'arm64\cdb.exe' }) |
                 Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          $py = (Get-Command python -ErrorAction SilentlyContinue).Source
          if ($cdb -and -not $py) { Write-Host 'cdb found but no python to read its transcript'; $cdb = $null }
          if ($cdb) { Write-Host "cdb: $cdb" }
          elseif ($env:PEU_A18_ALLOW_NO_CDB -eq '1') { Write-Host 'cdb: not on image, and PEU_A18_ALLOW_NO_CDB=1 is set -- OPT-OUT: exit codes only, the call chains are NOT proven (#150 stays open)' }
          else { Write-Host 'FAIL: no cdb (or no python to read its transcripts) on the image: the call chains cannot be proven. Set PEU_A18_ALLOW_NO_CDB=1 only to opt out on purpose.'; exit 1 }
          # the cases must be the 22 the build step makes, and every file there
          $cases = @(Get-Content (Join-Path $D 'cases.tsv') | Where-Object { $_ })
          $nf = @($cases | Where-Object { ($_ -split "`t")[1] -eq 'fault' }).Count
          $ne = @($cases | Where-Object { ($_ -split "`t")[1] -eq 'exec' }).Count
          if ($cases.Count -ne 22 -or $nf -ne 14 -or $ne -ne 8) { Write-Host "FAIL: cases.tsv has $($cases.Count) cases ($nf fault, $ne exec), want 22 (14 fault, 8 exec)"; exit 1 }
          $need = @('child.exe')
          foreach ($c in $cases) { $f = $c -split "`t"; $need += "$($f[0]).exe", "$($f[0]).lst"; if ($f[1] -eq 'fault') { $need += "$($f[0])_nouw.exe", "$($f[0])_nouw.lst" } }
          $miss = @($need | Where-Object { -not (Test-Path -LiteralPath (Join-Path $D $_)) })
          if ($miss.Count) { Write-Host "FAIL: missing before the run: $($miss -join ', ')"; exit 1 }
          Write-Host "cases: 22 (14 fault, 8 exec), $($need.Count) files present"
          # the transcript reader of tests/windows/cdb_chain.sh (laptop-side
          # there): names the image's frames from the listing and requires
          # <chain>, then KERNEL32!BaseThreadInitThunk, ntdll!RtlUserThreadStart
          $parser = Join-Path $env:RUNNER_TEMP 'cdb_chain_parse.py'
          Set-Content -LiteralPath $parser -Encoding utf8 -Value @'
          import re, sys

          def main():
              lst, mod, want, trc = sys.argv[1], sys.argv[2].lower(), sys.argv[3].split(','), sys.argv[4]
              labels, code_end = [], None
              for l in open(lst, encoding='latin-1'):
                  m = re.match(r'^([A-Za-z_.$][\w.$@]*):\s*$', l)
                  m2 = re.match(r'^\s+([0-9a-f]{8}): ', l)
                  if m and not m2:
                      labels.append([None, m.group(1)])
                  if m2 and labels and labels[-1][0] is None:
                      labels[-1][0] = int(m2.group(1), 16)
                  if l.startswith('; uw-code-end '):
                      code_end = int(l.split()[2], 16)
              labels = [(o, n) for o, n in labels if o is not None]
              def name_of(rva):
                  off = rva - 0x1000
                  if off < 0 or (code_end is not None and off >= code_end):
                      return '?+0x%x' % rva
                  own = [n for o, n in labels if o <= off]
                  return own[-1] if own else '?+0x%x' % rva
              out = open(trc, encoding='latin-1').read()
              frames, ink = [], False
              for l in out.split('\n'):
                  if re.match(r'^\s*#?\s*Child-SP\s+RetAddr\s+Call Site', l):
                      ink = True; frames = []; continue
                  if ink:
                      m = re.match(r'^\s*(?:[0-9a-f]+\s+)?[0-9a-f`]+\s+[0-9a-f`]+\s+(\S+)', l)
                      if not m:
                          if frames:
                              ink = False
                          continue
                      mm = re.match(r'^([^!+]+)(?:!([^+]+))?(?:\+0x([0-9a-f]+))?$', m.group(1), re.I)
                      if not mm:
                          frames.append(('?', m.group(1))); continue
                      mo, fn, off = mm.group(1), mm.group(2), mm.group(3)
                      if mo.lower() == mod and fn is None and off:
                          frames.append(('img', name_of(int(off, 16))))
                      else:
                          frames.append(('ext', '%s!%s' % (mo, fn) if fn else m.group(1)))
              print('chain: ' + ' > '.join(n for _, n in frames))
              if 'Access violation - code c0000005' not in out:
                  print('ERROR: the last event is not the access violation'); sys.exit(2)
              if not frames:
                  print('ERROR: no k stack in the transcript'); sys.exit(2)
              i = 0
              while i < len(frames) and frames[i][0] != 'img':
                  i += 1
              j = i
              while j < len(frames) and frames[j][0] == 'img':
                  j += 1
              img = [n for _, n in frames[i:j]]
              rest = [n.lower() for _, n in frames[j:j + 2]]
              ok_img = (img[-(len(want) - 1):] == want[1:]) if want[0] == '...' else (img == want)
              if not (ok_img and rest == ['kernel32!basethreadinitthunk', 'ntdll!rtluserthreadstart']):
                  print('MISMATCH: image frames %s (want %s), then %s' % (img, want, rest)); sys.exit(1)
              print('OK')

          # exit 0: the chain holds; 1: ONLY a chain mismatch found after the access
          # violation; 2: anything else (no access violation, unreadable listing or
          # transcript, a crash of this reader) -- so a --test-no-unwind twin passes
          # only on a real broken chain
          try:
              main()
          except SystemExit:
              raise
          except BaseException as ex:
              print('ERROR: transcript reader crashed: %r' % (ex,)); sys.exit(2)

          '@
          function Chain($exe, $lst, $want) {
            $t = Join-Path $env:RUNNER_TEMP ("$exe.cdb.txt")
            & $cdb -lines -c 'g; .lastevent; k 30; q' (Join-Path $D "$exe.exe") *> $t
            & $py -B $parser (Join-Path $D $lst) $exe $want $t | Write-Host
            return $LASTEXITCODE
          }
          foreach ($line in $cases) {
            $f = $line -split "`t"; $img = $f[0]; $kind = $f[1]; $want = $f[2]; $chain = $f[3]
            if ($kind -eq 'exec') {
              & (Join-Path $D "$img.exe"); $rc = $LASTEXITCODE
              if ($rc -ne 7) { Write-Host "FAIL: $img exit $rc, want 7 (#174)"; $bad++ } else { Write-Host "PASS: $img exit 7" }
              continue
            }
            for ($k = 1; $k -le 3; $k++) {
              $out = (& (Join-Path $D "$img.exe") 2>$null) -join '|'; $rc = $LASTEXITCODE
              if ($rc -ne -1073741819 -or $out -ne $want) { Write-Host "FAIL: $img run $k exit $rc stdout '$out', want -1073741819 '$want'"; $bad++ }
            }
            Write-Host "${img}: 3 runs done"
            if ($cdb) {
              $r = Chain $img "$img.lst" $chain
              if ($r -ne 0) { Write-Host "FAIL: $img cdb chain (reader exit $r)"; $bad++ } else { Write-Host "PASS: $img chain $chain" }
              $r = Chain "${img}_nouw" "${img}_nouw.lst" $chain
              if ($r -eq 1) { Write-Host "PASS: ${img}_nouw chain broken after the access violation, as it must be" }
              elseif ($r -eq 0) { Write-Host "FAIL: ${img}_nouw (--test-no-unwind): the chain held without tables"; $bad++ }
              else { Write-Host "FAIL: ${img}_nouw: the transcript reader failed (exit $r), not a chain mismatch"; $bad++ }
            }
          }
          if ($bad) { Write-Host "pe-unwind arm64: $bad failures"; exit 1 }
          Write-Host 'pe-unwind arm64: all fixtures PASS'
          exit 0

  source-check:
    name: Source integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: No build artifacts tracked
        run: |
          if git ls-files -- 'build/*' 'dist/*' '*.krbo' 'a.out' | grep -q .; then
            echo "ERROR: build artifacts are tracked"
            exit 1
          fi
          echo "Clean: no artifacts tracked"

      - name: Source stats
        run: |
          echo "=== KernRift Self-Hosted Compiler ==="
          wc -l src/*.kr
          echo "---"
          echo "Total: $(cat src/*.kr | wc -l) lines"
          echo "Functions: $(grep -c '^fn ' src/*.kr)"
