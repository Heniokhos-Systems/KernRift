name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap build/krc2
        run: |
          mkdir -p build
          # Hardened download (see ci.yml for rationale).
          curl --fail --location --silent --show-error \
               --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 15 \
               -o build/krc-bootstrap \
               https://github.com/Heniokhos-Systems/KernRift/releases/download/v2.9.0/krc-linux-x86_64
          SIZE=$(wc -c < build/krc-bootstrap)
          MAGIC=$(head -c 4 build/krc-bootstrap | xxd -p)
          if [ "$MAGIC" != "7f454c46" ] || [ "$SIZE" -lt 1048576 ]; then
            echo "FAIL: krc-bootstrap download is not a valid ELF (size=$SIZE magic=0x$MAGIC)"
            head -c 256 build/krc-bootstrap | cat -v
            exit 1
          fi
          chmod +x build/krc-bootstrap
          # Concatenate sources via the Makefile target (single source of
          # truth for SRCS) so this never drifts — a missing file here, e.g.
          # type_check.kr, would only surface as a confusing "undefined
          # function" at bootstrap time.
          make build/krc.kr
          # Bootstrap: compile source with the pinned release krc (--legacy for
          # speed), then re-compile with itself (which uses IR by default).
          ./build/krc-bootstrap --legacy --arch=x86_64 build/krc.kr -o build/krc2
          chmod +x build/krc2
          ./build/krc2 --arch=x86_64 build/krc.kr -o build/krc2.stable
          mv build/krc2.stable build/krc2
          chmod +x build/krc2

      - name: Create distribution
        run: make dist

      - name: Build all platform binaries
        run: |
          # R1 fix landed: IR ARM64 now spills 9+-arg calls to stack per
          # AAPCS64, so the previous --legacy --arch=arm64 override that
          # this workflow carried is no longer needed. All variants go
          # through the IR backend now.
          ./build/krc2 --arch=x86_64 --emit=pe build/krc.kr -o dist/krc-windows-x86_64.exe
          ./build/krc2 --arch=arm64 --emit=pe build/krc.kr -o dist/krc-windows-arm64.exe
          # krc for macOS
          ./build/krc2 --arch=x86_64 --emit=macho build/krc.kr -o dist/krc-macos-x86_64
          ./build/krc2 --arch=arm64 --emit=macho build/krc.kr -o dist/krc-macos-arm64
          # krc for Android
          ./build/krc2 --arch=arm64 --emit=android build/krc.kr -o dist/krc-android-arm64
          ./build/krc2 --arch=x86_64 --emit=android build/krc.kr -o dist/krc-android-x86_64
          # kr runner (merge bcj.kr + runner.kr)
          cat src/bcj.kr src/runner.kr > build/kr.kr
          ./build/krc2 --arch=x86_64 build/kr.kr -o dist/kr-linux-x86_64
          ./build/krc2 --arch=arm64  build/kr.kr -o dist/kr-linux-arm64
          chmod +x dist/kr-linux-x86_64 dist/kr-linux-arm64
          # kr runner (Windows)
          ./build/krc2 --arch=x86_64 --emit=pe build/kr.kr -o dist/kr-windows-x86_64.exe
          ./build/krc2 --arch=arm64  --emit=pe build/kr.kr -o dist/kr-windows-arm64.exe
          # kr runner (macOS)
          ./build/krc2 --arch=x86_64 --emit=macho build/kr.kr -o dist/kr-macos-x86_64
          ./build/krc2 --arch=arm64  --emit=macho build/kr.kr -o dist/kr-macos-arm64
          # kr runner (Android)
          ./build/krc2 --emit=android build/kr.kr -o dist/kr-android-arm64
          ./build/krc2 --arch=x86_64 --emit=android build/kr.kr -o dist/kr-android-x86_64

      - name: Bundle Windows krc+kr zips
        # One zip per architecture, each containing krc.exe + kr.exe at
        # the archive root (renamed from the per-arch artifact names).
        # Consumed by the winget NestedInstaller manifest below so a
        # single `winget install Pantelis23.KernRift` drops both
        # binaries into PATH.
        run: |
          cd dist
          mkdir -p _bundle_x64 _bundle_arm64
          cp krc-windows-x86_64.exe _bundle_x64/krc.exe
          cp kr-windows-x86_64.exe  _bundle_x64/kr.exe
          cp krc-windows-arm64.exe  _bundle_arm64/krc.exe
          cp kr-windows-arm64.exe   _bundle_arm64/kr.exe
          # Apache 2.0 §4(a)/§4(d): a copy of the License and the NOTICE
          # attribution must travel with every redistributed copy.
          cp ../LICENSE ../NOTICE _bundle_x64/
          cp ../LICENSE ../NOTICE _bundle_arm64/
          # The standard library MUST travel with the binaries. Without it a
          # winget install could not resolve `import "std/..."` at all: krc
          # locates the stdlib relative to its own exe, and the package had no
          # std/ to find. Every other packaging (deb, AUR, Homebrew, Scoop,
          # install.sh, install.ps1) already ships it; the zip did not.
          # Placed at the archive ROOT, beside krc.exe, which matches the
          # <exe_dir> search path. (install.ps1 uses the other supported
          # layout, bin\krc.exe with std\ as a sibling, via <exe_dir>..\.)
          cp -r ../std _bundle_x64/std
          cp -r ../std _bundle_arm64/std
          (cd _bundle_x64   && zip -qr ../krc-windows-x86_64.zip krc.exe kr.exe LICENSE NOTICE std)
          (cd _bundle_arm64 && zip -qr ../krc-windows-arm64.zip  krc.exe kr.exe LICENSE NOTICE std)
          rm -rf _bundle_x64 _bundle_arm64
          # Standalone copies so the bare single-file binary downloads are
          # accompanied by the license and attribution too.
          cp ../LICENSE ../NOTICE .

      - name: Verify binaries
        run: |
          echo "=== Distribution ==="
          ls -la dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum krc-linux-x86_64 krc-linux-arm64 \
                    krc-windows-x86_64.exe krc-windows-arm64.exe \
                    krc-windows-x86_64.zip krc-windows-arm64.zip \
                    krc-macos-x86_64 krc-macos-arm64 \
                    krc-android-arm64 krc-android-x86_64 \
                    kr-linux-x86_64 kr-linux-arm64 \
                    kr-windows-x86_64.exe kr-windows-arm64.exe \
                    kr-macos-x86_64 kr-macos-arm64 \
                    kr-android-arm64 kr-android-x86_64 \
                    krc.krbo krc-source.kr LICENSE NOTICE > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/krc-linux-x86_64
            dist/krc-linux-arm64
            dist/krc-windows-x86_64.exe
            dist/krc-windows-arm64.exe
            dist/krc-windows-x86_64.zip
            dist/krc-windows-arm64.zip
            dist/krc-macos-x86_64
            dist/krc-macos-arm64
            dist/krc-android-arm64
            dist/krc-android-x86_64
            dist/kr-linux-x86_64
            dist/kr-linux-arm64
            dist/kr-windows-x86_64.exe
            dist/kr-windows-arm64.exe
            dist/kr-macos-x86_64
            dist/kr-macos-arm64
            dist/kr-android-arm64
            dist/kr-android-x86_64
            dist/krc.krbo
            dist/krc-source.kr
            dist/LICENSE
            dist/NOTICE
            dist/SHA256SUMS
          generate_release_notes: true

  update-packaging:
    # AUR, Homebrew and Scoop manifests are hand-maintained files in this repo,
    # and every one of them pins both a version and the SHA256 of the published
    # artifacts -- which do not exist until build-release has finished. They
    # were therefore updated by hand after each release, and drifted: v2.8.33
    # shipped with all four still reading 2.8.32.
    #
    # This job closes that gap. It runs after the artifacts are live, rewrites
    # the manifests from the release's own SHA256SUMS, and commits the result
    # to main.
    name: Update packaging manifests
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          # A token with write access is needed to push the commit back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite manifests from the published release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/update-packaging.sh "$VERSION"

      - name: Verify .SRCINFO stayed in sync
        run: |
          # Same check tests/run_tests.sh runs, asserted here too so a broken
          # manifest never reaches main -- this job commits without running the
          # full suite.
          GEN=$(bash -c '
            set -e
            source packaging/aur/PKGBUILD
            printf "pkgbase = %s\n" "$pkgname"
            printf "\tpkgdesc = %s\n" "$pkgdesc"
            printf "\tpkgver = %s\n" "$pkgver"
            printf "\tpkgrel = %s\n" "$pkgrel"
            printf "\turl = %s\n" "$url"
            for a in "${arch[@]}"; do printf "\tarch = %s\n" "$a"; done
            for l in "${license[@]}"; do printf "\tlicense = %s\n" "$l"; done
            for pr in "${provides[@]}"; do printf "\tprovides = %s\n" "$pr"; done
            for o in "${options[@]}"; do printf "\toptions = %s\n" "$o"; done
            for x in "${source_x86_64[@]}"; do printf "\tsource_x86_64 = %s\n" "$x"; done
            for x in "${sha256sums_x86_64[@]}"; do printf "\tsha256sums_x86_64 = %s\n" "$x"; done
            for x in "${source_aarch64[@]}"; do printf "\tsource_aarch64 = %s\n" "$x"; done
            for x in "${sha256sums_aarch64[@]}"; do printf "\tsha256sums_aarch64 = %s\n" "$x"; done
            printf "\npkgname = %s\n" "$pkgname"
          ')
          if [ "$GEN" != "$(cat packaging/aur/.SRCINFO)" ]; then
            echo "FAIL: .SRCINFO does not match PKGBUILD after the rewrite"
            diff <(printf '%s\n' "$GEN") packaging/aur/.SRCINFO | head -20
            exit 1
          fi
          echo "OK: .SRCINFO in sync"

      - name: Commit and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if git diff --quiet -- packaging/ bucket/; then
            echo "No manifest changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths only: this job must never sweep up anything else
          # that happens to be in the tree.
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO \
                  packaging/homebrew/kernrift.rb bucket/kernrift.json
          git commit \
            -m "chore(packaging): update AUR/Homebrew/Scoop manifests to v$VERSION" \
            -m "Generated by scripts/update-packaging.sh from the v$VERSION release's own SHA256SUMS asset."
          git push origin HEAD:main

      # The two steps below close a real gap: this job UPDATES the manifests in
      # this repo but, until now, never PUBLISHED them. The Homebrew tap and the
      # AUR both drifted silently as a result — at v2.8.34 they were still on
      # 2.8.32, i.e. two releases behind, which is what `brew install` and
      # `yay -S` were actually serving. Scoop is unaffected: this repo IS the
      # bucket. Both steps are gated on their secret so a fork or an
      # unconfigured repo skips them cleanly instead of failing the release.

      - name: Publish formula to the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_TOKEN not configured — skipping Homebrew tap publish."
            echo "The formula in packaging/homebrew/ is updated; the tap is not."
            echo "To enable: a PAT with write access to Heniokhos-Systems/homebrew-kernrift, then"
            echo "  gh secret set TAP_TOKEN --repo Heniokhos-Systems/KernRift"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          WORK=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Heniokhos-Systems/homebrew-kernrift.git" "$WORK/tap"
          cp packaging/homebrew/kernrift.rb "$WORK/tap/Formula/kernrift.rb"
          cd "$WORK/tap"
          if git diff --quiet; then echo "Tap already current."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kernrift.rb
          git commit -m "kernrift $VERSION"
          git push origin HEAD:main

      - name: Publish PKGBUILD to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "AUR_SSH_KEY not configured — skipping AUR publish."
            echo "packaging/aur/ is updated in this repo; the AUR is not."
            echo "To enable: the private half of the key registered with the AUR account, then"
            echo "  gh secret set AUR_SSH_KEY --repo Heniokhos-Systems/KernRift < ~/.ssh/<key>"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=yes"
          WORK=$(mktemp -d)
          git clone "ssh://aur@aur.archlinux.org/kernrift.git" "$WORK/aur"
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO "$WORK/aur/"
          cd "$WORK/aur"
          if git diff --quiet; then echo "AUR already current."; exit 0; fi
          git config user.name  "Pantelis23"
          git config user.email "pantelisworks@gmail.com"
          git add PKGBUILD .SRCINFO
          git commit -m "kernrift $VERSION"
          git push origin master

  winget-release:
    # Submits a hand-crafted winget manifest with a zip InstallerType +
    # NestedInstallerFiles so one `winget install Pantelis23.KernRift`
    # drops both krc.exe and kr.exe into PATH. The previous iteration
    # used vedantmgoyal9/winget-releaser which only supports portable
    # single-binary manifests — it shipped krc but silently dropped kr.
    name: Submit winget manifest (nested zip)
    needs: build-release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wait for release assets (avoids the tag-push race with release.yml's own build job)
        # This job runs in the same workflow run as build-release, but as a
        # separate job it can still observe the release before build-release
        # has finished uploading krc-windows-*.zip. Poll instead of assuming
        # they're already there -- same disease fixed for aur-test/scoop-test
        # in 465d06a, just within a single workflow instead of across two.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/wait-for-release-assets.sh \
            "${{ github.repository }}" "${{ github.ref_name }}" \
            krc-windows-x86_64.zip krc-windows-arm64.zip

      - name: Fetch release zip SHAs
        id: shas
        run: |
          set -euo pipefail
          V="${{ github.ref_name }}"
          for url in \
            "https://github.com/Heniokhos-Systems/KernRift/releases/download/$V/krc-windows-x86_64.zip" \
            "https://github.com/Heniokhos-Systems/KernRift/releases/download/$V/krc-windows-arm64.zip"; do
            curl -fsSL -o "/tmp/$(basename "$url")" "$url"
          done
          echo "x64=$(sha256sum /tmp/krc-windows-x86_64.zip | awk '{print toupper($1)}')"   >> "$GITHUB_OUTPUT"
          echo "arm64=$(sha256sum /tmp/krc-windows-arm64.zip | awk '{print toupper($1)}')" >> "$GITHUB_OUTPUT"

      - name: Generate manifests + open winget-pkgs PR
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ github.ref_name }}
          X64_SHA: ${{ steps.shas.outputs.x64 }}
          ARM64_SHA: ${{ steps.shas.outputs.arm64 }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          WORK=$(mktemp -d)
          MDIR="$WORK/pkg/manifests/p/Pantelis23/KernRift/$VERSION"
          mkdir -p "$MDIR"

          cat > "$MDIR/Pantelis23.KernRift.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.version.1.10.0.schema.json
          PackageIdentifier: Pantelis23.KernRift
          PackageVersion: $VERSION
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.10.0
          EOF

          # NestedInstallerType lives at the TOP LEVEL (it's the same
          # across architectures), and only NestedInstallerFiles varies
          # per-Installer entry. Matches UPX.UPX 5.0.1 and every other
          # zip+portable package currently accepted by winget-pkgs at
          # ManifestVersion 1.10.0.
          cat > "$MDIR/Pantelis23.KernRift.installer.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
          PackageIdentifier: Pantelis23.KernRift
          PackageVersion: $VERSION
          InstallerType: zip
          NestedInstallerType: portable
          # Extensions the package SUPPORTS (i.e. can open), per the winget
          # schema — not the extension of its own binaries. This is a
          # compiler: it consumes .kr source. It said 'exe' for several
          # releases, which claimed the package handles executables.
          FileExtensions:
          - kr
          Commands:
          - krc
          - kr
          ReleaseDate: $TODAY
          Installers:
          - Architecture: x64
            NestedInstallerFiles:
            - RelativeFilePath: krc.exe
              PortableCommandAlias: krc
            - RelativeFilePath: kr.exe
              PortableCommandAlias: kr
            InstallerUrl: https://github.com/Heniokhos-Systems/KernRift/releases/download/$VERSION/krc-windows-x86_64.zip
            InstallerSha256: $X64_SHA
          - Architecture: arm64
            NestedInstallerFiles:
            - RelativeFilePath: krc.exe
              PortableCommandAlias: krc
            - RelativeFilePath: kr.exe
              PortableCommandAlias: kr
            InstallerUrl: https://github.com/Heniokhos-Systems/KernRift/releases/download/$VERSION/krc-windows-arm64.zip
            InstallerSha256: $ARM64_SHA
          ManifestType: installer
          ManifestVersion: 1.10.0
          EOF

          # Locale metadata — matches the set of fields the winget-pkgs bot
          # flags as "Manifest-Metadata-Consistency" inconsistencies when
          # comparing against the previously-published version. Keep parity.
          cat > "$MDIR/Pantelis23.KernRift.locale.en-US.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.defaultLocale.1.10.0.schema.json
          PackageIdentifier: Pantelis23.KernRift
          PackageVersion: $VERSION
          PackageLocale: en-US
          Publisher: Pantelis Christou
          PublisherUrl: https://github.com/Heniokhos-Systems/KernRift
          PublisherSupportUrl: https://github.com/Heniokhos-Systems/KernRift/issues
          Author: Pantelis Christou
          PackageName: KernRift
          PackageUrl: https://github.com/Heniokhos-Systems/KernRift
          License: Apache-2.0
          LicenseUrl: https://github.com/Heniokhos-Systems/KernRift/blob/HEAD/LICENSE
          Copyright: Copyright (c) 2025 Pantelis Christou
          ShortDescription: Self-hosted bare-metal systems programming language and compiler
          Description: KernRift is a zero-dependency self-hosted compiler. The package installs two portable command-line tools — krc (the compiler) and kr (the fat-binary runner). It compiles to native x86_64 and ARM64 binaries for Linux, Windows, macOS, and Android. The compiler is written entirely in KernRift itself and produces ELF, PE, Mach-O, and fat binaries.
          Moniker: kernrift
          Tags:
            - aot
            - arm64
            - bare-metal
            - compiler
            - cross-compiler
            - programming-language
            - self-hosted
            - systems-programming
            - x86_64
          ReleaseNotes: 'Full Changelog: https://github.com/Heniokhos-Systems/KernRift/releases/tag/$VERSION'
          ReleaseNotesUrl: https://github.com/Heniokhos-Systems/KernRift/releases/tag/$VERSION
          InstallationNotes: The install directory is added to PATH automatically by winget (portable nested installer). Run 'krc --version' and 'kr --version' to verify.
          ManifestType: defaultLocale
          ManifestVersion: 1.10.0
          EOF

          git config --global user.email "release-bot@users.noreply.github.com"
          git config --global user.name  "kernrift-release-bot"

          USER=$(gh api user --jq .login)
          # Ensure the fork exists under the token holder's account.
          gh repo fork microsoft/winget-pkgs --clone=false --remote=false >/dev/null 2>&1 || true

          cd "$WORK"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$USER/winget-pkgs.git" fork
          cd fork
          git remote add upstream https://github.com/microsoft/winget-pkgs.git
          git fetch --depth 1 upstream master
          git reset --hard upstream/master

          BRANCH="Pantelis23.KernRift-$VERSION"
          git checkout -b "$BRANCH"
          mkdir -p "manifests/p/Pantelis23/KernRift/$VERSION"
          cp "$MDIR"/*.yaml "manifests/p/Pantelis23/KernRift/$VERSION/"
          git add "manifests/p/Pantelis23/KernRift/$VERSION"
          git commit -m "New version: Pantelis23.KernRift $VERSION"
          git push --force-with-lease origin "$BRANCH"

          gh pr create \
            --repo microsoft/winget-pkgs \
            --title "New version: Pantelis23.KernRift $VERSION" \
            --body  "Automated submission. Zip installer with NestedInstallerFiles so both \`krc\` and \`kr\` land in PATH after one \`winget install\`." \
            --head  "$USER:$BRANCH" \
            --base  master
