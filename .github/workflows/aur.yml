name: aur-test

on:
  push:
    paths: ["packaging/aur/**", ".github/workflows/aur.yml"]
  pull_request:
    paths: ["packaging/aur/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed base-devel namcap

      - name: Stage PKGBUILD for a non-root build (makepkg refuses root)
        run: |
          useradd -m builder
          install -d /home/builder/b
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /home/builder/b/
          chown -R builder /home/builder/b

      - name: .SRCINFO is in sync with PKGBUILD
        run: |
          cd /home/builder/b
          su builder -c "makepkg --printsrcinfo" > .SRCINFO.gen
          if ! diff -u .SRCINFO .SRCINFO.gen; then
            echo "::error::.SRCINFO is stale -- regenerate with: makepkg --printsrcinfo > .SRCINFO"
            exit 1
          fi

      - name: Lint (namcap)
        run: |
          cd /home/builder/b
          namcap PKGBUILD

      - name: Wait for release assets (avoids the tag-push race with release.yml)
        # A tag push triggers this workflow and release.yml in the same
        # second. makepkg below downloads krc-linux-x86_64/kr-linux-x86_64
        # from that tag's release, which release.yml can still be building --
        # this workflow cannot win that race by assuming the assets exist.
        # Poll instead. The version comes from PKGBUILD's own pkgver, not a
        # literal, so this never drifts from what's actually being tested.
        run: |
          # The archlinux:latest container has curl but not `gh`, so this
          # polls via the unauthenticated public REST API (scripts/wait-for-
          # release-assets.sh falls back to it automatically). Well within
          # the unauthenticated rate limit at one request per 30s.
          PKGVER=$(grep -oE '^pkgver=.*' packaging/aur/PKGBUILD | cut -d= -f2)
          bash scripts/wait-for-release-assets.sh \
            "${{ github.repository }}" "v$PKGVER" \
            krc-linux-x86_64 kr-linux-x86_64

      - name: Build (verifies all source checksums)
        run: |
          cd /home/builder/b
          su builder -c "makepkg -f"

      - name: Install + stdlib import test
        run: |
          cd /home/builder/b
          pacman -U --noconfirm ./kernrift-*.pkg.tar.zst
          krc --version
          printf 'import "std/io.kr"\nfn main() -> uint64 {\n    return 0\n}\n' > /tmp/t.kr
          krc /tmp/t.kr -o /tmp/t.krbo
          test -f /tmp/t.krbo && echo "PASS: std/io.kr resolved from /usr/share/kernrift"
